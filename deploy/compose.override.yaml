services:
  api:
    environment:
      SEARXNG_ENDPOINT: http://searxng:8080
    depends_on:
      searxng:
        condition: service_started
    ports: !override
      - "127.0.0.1:3002:3002"
  redis:
    command: redis-server --appendonly yes --bind 0.0.0.0
    volumes:
      - redis-data:/data
  rabbitmq:
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  nuq-postgres:
    volumes:
      - postgres-data:/var/lib/postgresql/data
  foundationdb:
    profiles: [fdb]
  foundationdb-init:
    profiles: [fdb]
  searxng:
    image: ghcr.io/searxng/searxng:2026.11.11-248b8ffc0@sha256:71a410e383ea1c1f973a0c38e566757c1f0c5f3976a33be2c70918fcd93bdcc7
    networks:
      - backend
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-temporary-secret-for-config-check}
    volumes:
      - "${FIRECRAWL_DEPLOY_ROOT:?}/deploy/searxng-settings.yml:/etc/searxng/settings.yml:ro"
volumes:
  redis-data:
  rabbitmq-data:
  postgres-data:
